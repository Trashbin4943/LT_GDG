{% extends 'base.html' %} {% block title %}파일 업로드 - LinguaTech{% endblock %} {% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5 text-center">
                <h3 class="fw-bold text-primary mb-3">📂 통화 녹음 업로드</h3>
                <p class="text-muted mb-4">WAV, MP3, M4A 파일을 지원합니다.</p>

                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-4 text-start">
                        <label for="audioFile" class="form-label fw-bold">파일 선택</label>
                        <input
                            type="file"
                            class="form-control form-control-lg"
                            id="audioFile"
                            name="file"
                            accept="audio/*"
                            required
                        />
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm" id="uploadBtn">
                            🚀 분석 시작하기
                        </button>
                    </div>
                </form>

                <div id="progressArea" class="d-none mt-4">
                    <p class="mb-2 fw-bold text-primary">파일 업로드 및 분석 준비 중...</p>
                    <div class="progress" style="height: 10px">
                        <div
                            class="progress-bar progress-bar-striped progress-bar-animated"
                            role="progressbar"
                            style="width: 100%"
                        ></div>
                    </div>
                </div>

                <div id="resultArea" class="d-none mt-4 alert alert-success text-start">
                    <h5 class="alert-heading fw-bold"><i class="bi bi-check-circle-fill"></i> 업로드 성공!</h5>
                    <p class="mb-1">분석 세션이 생성되었습니다.</p>
                    <p class="small text-muted mb-3">Session ID: <strong id="sessionId"></strong></p>

                    <div class="d-flex gap-2">
                        <a href="/" class="btn btn-outline-success btn-sm">🏠 메인으로</a>
                        <a id="detailBtn" href="#" class="btn btn-success btn-sm shadow-sm"> 📝 결과 보정하기 </a>
                    </div>
                </div>

                <div id="errorArea" class="d-none mt-4 alert alert-danger"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %} {% block extra_js %}
<script>
    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        // 요소 가져오기
        const fileInput = document.getElementById('audioFile');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressArea = document.getElementById('progressArea');
        const resultArea = document.getElementById('resultArea');
        const sessionIdEl = document.getElementById('sessionId'); // 👈 여기!
        const detailBtn = document.getElementById('detailBtn'); // 👈 여기!
        const errorArea = document.getElementById('errorArea');

        // 파일 없으면 중단
        if (!fileInput.files[0]) {
            alert('파일을 선택해주세요.');
            return;
        }

        // 토큰 확인
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return;
        }

        // UI 상태 변경 (로딩 시작)
        uploadBtn.disabled = true;
        uploadBtn.innerText = '⏳ 업로드 중...';
        progressArea.classList.remove('d-none');
        resultArea.classList.add('d-none');
        errorArea.classList.add('d-none');

        // 데이터 준비
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/api/audio/upload', {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${token}`,
                    // 주의: FormData 쓸 땐 'Content-Type' 헤더를 직접 설정하면 안 됨 (브라우저가 알아서 함)
                },
                body: formData,
            });

            const data = await response.json();

            if (response.ok) {
                // ✅ 성공 시 처리
                progressArea.classList.add('d-none'); // 로딩 숨김
                resultArea.classList.remove('d-none'); // 결과 보임

                // 1. 세션 ID 텍스트 넣기 (에러 났던 부분)
                if (sessionIdEl) sessionIdEl.innerText = data.session_id;

                // 2. 버튼 링크 연결
                if (detailBtn) detailBtn.href = `/audio/correction/${data.session_id}/`;

                uploadBtn.innerText = '완료';
            } else {
                throw new Error(data.message || '업로드 실패');
            }
        } catch (error) {
            console.error(error);
            progressArea.classList.add('d-none');
            errorArea.classList.remove('d-none');
            errorArea.innerText = `❌ 오류 발생: ${error.message}`;

            uploadBtn.disabled = false;
            uploadBtn.innerText = '🚀 분석 시작하기';
        }
    });
</script>
{% endblock %}
