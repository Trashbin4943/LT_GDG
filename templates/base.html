<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}LinguaTech Project{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">🎙️ RESONANCE </a>
                <div class="d-flex">
                    <div id="guest-menu">
                        <a href="/login" class="btn btn-outline-light btn-sm me-2">로그인</a>
                        <a href="/signup" class="btn btn-light btn-sm">회원가입</a>
                    </div>
                    <div id="user-menu" class="d-none">
                        <span class="text-white me-3" id="nav-username">님</span>
                        <button onclick="logout()" class="btn btn-outline-light btn-sm">로그아웃</button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container">{% block content %}{% endblock %}</div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // 공통 인증 체크 로직
            const accessToken = localStorage.getItem('access_token');
            const guestMenu = document.getElementById('guest-menu');
            const userMenu = document.getElementById('user-menu');

            if (accessToken) {
                guestMenu.classList.add('d-none');
                userMenu.classList.remove('d-none');
                // 간단히 이름 표시 (더 정교하게 하려면 API 호출 필요)
                // document.getElementById('nav-username').innerText = '사용자';
            } else {
                guestMenu.classList.remove('d-none');
                userMenu.classList.add('d-none');
            }

            function logout() {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login';
            }
        </script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
